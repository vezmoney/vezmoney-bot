name: Tendencias · corrección desde Telegram

# Lo dispara el bot de Cloudflare cuando Francisco pide un cambio:
#   idea_editada     → Claude corrige la idea y se reenvía para la 1.ª aprobación.
#   pieza_correccion → Claude corrige la pieza, se vuelve a diseñar y se reenvía para la 2.ª aprobación.
on:
  repository_dispatch:
    types: [idea_editada, pieza_correccion]
  workflow_dispatch:
    inputs:
      tipo:
        description: "idea o pieza"
        type: choice
        options: [pieza, idea]
        default: pieza
      id:
        description: "Id (ej. 2026-11-06-1-A para una pieza, 2026-11-06-1 para una idea)"
        required: true
      cambio:
        description: "Cambio pedido"
        required: true

# un grupo por pieza para que no se pierdan correcciones seguidas
concurrency:
  group: tendencias-correccion-${{ github.event.client_payload.id || inputs.id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TIPO: ${{ github.event.action == 'idea_editada' && 'idea' || (github.event.action == 'pieza_correccion' && 'pieza' || inputs.tipo) }}
      ID: ${{ github.event.client_payload.id || inputs.id }}
      CAMBIO: ${{ github.event.client_payload.cambio || inputs.cambio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code
      - name: Claude aplica el cambio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [ "$TIPO" = "idea" ]; then node src/tendencias/corregir.mjs --idea="$ID" --cambio="$CAMBIO"
          else node src/tendencias/corregir.mjs --pieza="$ID" --cambio="$CAMBIO"; fi
      - name: Subir los cambios
        run: |
          git config user.name "vezmoney-bot"
          git config user.email "vezmoney-bot@users.noreply.github.com"
          git add tendencias out/tendencias
          git diff --cached --quiet || git commit -m "Tendencias: corrección de $ID"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break || sleep 6; done
      - name: Reenviar la pieza a Telegram
        if: env.TIPO == 'pieza'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: node src/tendencias/enviar.mjs --nota="$(cat out/tendencias/_nota.txt)"
