name: Tendencias · ideas del día (1.ª aprobación)

# Cada mañana (8:30 de Chile) busca tendencias y noticias, Claude propone ideas con sus 2 piezas y llegan a Telegram para aprobar.
# También se dispara cuando alguien escribe /idea en Telegram (repository_dispatch "idea_manual").
on:
  schedule:
    # 11:30 y 12:30 UTC: una de las dos cae a las 8:30 de Chile según horario de verano o invierno; el paso "hora" descarta la otra.
    - cron: "30 11 * * 1-6"
    - cron: "0 12 * * 1-6"
    - cron: "30 12 * * 1-6"
    - cron: "0 13 * * 1-6"
    - cron: "30 13 * * 1-6"
    - cron: "0 14 * * 1-6"
  workflow_dispatch:
    inputs:
      manual:
        description: "(opcional) texto o link a convertir en idea; vacío = ideas del día"
        required: false
      n:
        description: "(opcional) cuántas ideas"
        required: false
  repository_dispatch:
    types: [idea_manual, ideas_diarias]

concurrency:
  group: tendencias-ideas-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ideas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: ¿Toca correr? (8 de la mañana en Chile y secretos cargados)
        id: hora
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$WORKER_URL" ] || { [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; }; then echo "Faltan los secretos WORKER_URL o la clave de Claude (CLAUDE_CODE_OAUTH_TOKEN o ANTHROPIC_API_KEY): el bot de tendencias aún no está activado."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.action }}" = "ideas_diarias" ] && { [ "$(TZ=America/Santiago date +%H | sed s/^0//)" -lt 8 ] || [ "$(TZ=America/Santiago date +%H | sed s/^0//)" -gt 10 ] || [ -f "tendencias/auto/$(TZ=America/Santiago date +%F)" ]; }; then echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.hora.outputs.go == 'true'
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
        if: steps.hora.outputs.go == 'true'
      - name: ffmpeg (para los videos)
        if: steps.hora.outputs.go == 'true'
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Ideas con Claude
        if: steps.hora.outputs.go == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          MANUAL: ${{ github.event.client_payload.texto || inputs.manual }}
          N: ${{ inputs.n }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          EXTRA=""
          if [ -n "$N" ]; then EXTRA="--n=$N"; fi
          if [ -n "$MANUAL" ]; then node src/tendencias/ideas.mjs --manual="$MANUAL"; else node src/tendencias/ideas.mjs $EXTRA; fi
      - name: Marcar que las ideas automáticas de hoy ya salieron
        if: steps.hora.outputs.go == 'true' && (github.event_name == 'schedule' || github.event.action == 'ideas_diarias')
        run: mkdir -p tendencias/auto && touch "tendencias/auto/$(TZ=America/Santiago date +%F)"
      - name: Guardar en el repo
        if: steps.hora.outputs.go == 'true'
        run: |
          git config user.name "vezmoney-bot"
          git config user.email "vezmoney-bot@users.noreply.github.com"
          git add tendencias
          git diff --cached --quiet || git commit -m "Tendencias: ideas $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break || { git rebase --abort 2>/dev/null; sleep 6; }; done
